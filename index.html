<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Жалайр: нойр, хоол, дасгал, анхаарлаа өдөр бүр тэмдэглэх апп.">
<meta name="theme-color" content="#f7f2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150d1a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235d2b70'/%3E%3Ccircle cx='38' cy='38' r='14' fill='%23f0a136'/%3E%3C/svg%3E">
<title>Жалайр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column, like a pocket notebook. One question per screen, fixed tab bar at the bottom.
   Palette: plum night (sleep) and saffron sunrise (morning, food). Jade and coral are used only for good/low. */
:root{
  --bg:#f7f2f6; --surface:#ffffff; --surface2:#f0e7ef; --line:#e4d8e2;
  --ink:#2b1631; --ink2:#6d5a73;
  --plum:#5d2b70; --saffron:#f0a136; --on-saffron:#2b1631; --accent-text:#9c5600;
  --good:#1d8a63; --low:#c4473a; --sky:#2e6ab0;
  --hero-a:#fde3c1; --hero-b:#f3e4f0;
  --shadow:0 1px 0 rgba(43,22,49,.04),0 10px 26px rgba(43,22,49,.07);
  --t-sun:color-mix(in srgb,var(--saffron) 20%,var(--surface));
  --t-plum:color-mix(in srgb,var(--plum) 13%,var(--surface));
  --t-good:color-mix(in srgb,var(--good) 15%,var(--surface));
  --t-sky:color-mix(in srgb,var(--sky) 15%,var(--surface));
  --f-display:"Montserrat Alternates","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150d1a; --surface:#1f1429; --surface2:#2a1c35; --line:#3a2947;
  --ink:#f3eaf5; --ink2:#b3a1bb;
  --plum:#d4a5ea; --saffron:#f5ab48; --on-saffron:#20112a; --accent-text:#f5ab48;
  --good:#4cc796; --low:#ff7b6b; --sky:#86b6ff;
  --hero-a:#3d2149; --hero-b:#1f1429; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150d1a; --surface:#1f1429; --surface2:#2a1c35; --line:#3a2947;
  --ink:#f3eaf5; --ink2:#b3a1bb;
  --plum:#d4a5ea; --saffron:#f5ab48; --on-saffron:#20112a; --accent-text:#f5ab48;
  --good:#4cc796; --low:#ff7b6b; --sky:#86b6ff;
  --hero-a:#3d2149; --hero-b:#1f1429; --shadow:none; color-scheme:dark}
@supports not (color:color-mix(in srgb,red 50%,blue)){:root{--t-sun:var(--surface2);--t-plum:var(--surface2);--t-good:var(--surface2);--t-sky:var(--surface2)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2.page{font-size:25px;padding-top:4px}
h3{font-size:17px}
p{margin:0}
.col{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:rise .24s ease both}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.top>.col{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--plum);text-decoration:none;display:flex;align-items:baseline}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--saffron);display:inline-block;margin-left:3px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-current="page"]{color:var(--plum);border-color:var(--plum)}
.demo-bar{background:var(--t-sun);border-block:1px solid var(--line)}
.demo-bar .col{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;font-size:13.5px;font-weight:600}

main{padding-block:4px calc(100px + env(safe-area-inset-bottom,0px))}
section[data-view]{display:flex;flex-direction:column;gap:16px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:flex;justify-content:space-around;gap:2px;padding-block:6px}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border-radius:14px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:600;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--saffron)}

/* cards and buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
a.card{text-decoration:none;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);touch-action:manipulation;white-space:nowrap}
.btn.primary{background:var(--saffron);border-color:transparent;color:var(--on-saffron)}
.btn.plum{background:var(--plum);border-color:transparent;color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.soft{background:var(--surface2);border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--low);border-color:var(--low);background:transparent}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.input:focus{border-color:var(--saffron);outline:none}
.field{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.pill.good{color:var(--good);background:var(--t-good)} .pill.low{color:var(--low)} .pill.sun{background:var(--t-sun);color:var(--accent-text)}
.t-good{color:var(--good)} .t-low{color:var(--low)}
.notice{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.warn{display:flex;gap:12px;background:var(--t-sun);border-radius:16px;padding:14px}
.warn-i{width:26px;height:26px;border-radius:50%;background:var(--saffron);color:var(--on-saffron);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.agree{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.agree input{width:22px;height:22px;accent-color:var(--plum);margin:0}

/* today hero */
.hero-card{border-radius:26px;padding:20px 20px 14px;background:linear-gradient(165deg,var(--hero-a),var(--hero-b));display:flex;flex-direction:column;gap:6px;overflow:hidden}
.hero-card h1{font-size:clamp(24px,6.4vw,30px);line-height:1.15}
.arc{width:100%;height:auto;display:block;margin-top:4px}
.arc text{font-family:var(--f-mono);font-size:11px;fill:var(--ink2)}
.arc-hz{stroke:var(--ink2);stroke-opacity:.35;stroke-width:1.5}
.arc-path{fill:none;stroke:var(--plum);stroke-opacity:.35;stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
.arc-done{fill:none;stroke:var(--saffron);stroke-width:3;stroke-linecap:round}
.arc-sun{fill:var(--saffron)} .arc-glow{fill:var(--saffron);opacity:.22} .arc-moon{fill:var(--plum)}
.hero-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}

.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.slot .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--t-plum);color:var(--plum)}
.slot .ico svg{width:24px;height:24px}
.slot.done .ico{background:var(--saffron);color:var(--on-saffron)}
.fb{display:flex;flex-direction:column;gap:10px}
.fb p{display:flex;gap:10px;align-items:flex-start}
.fb .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex-shrink:0;background:var(--ink2)}
.fb .dot.good{background:var(--good)} .fb .dot.low{background:var(--low)}
.tip{background:var(--t-sun);border-radius:14px;padding:12px 14px;font-weight:500}
.tip b{color:var(--accent-text)}
.care{border-left:4px solid var(--plum)}
.care .num{font-family:var(--f-mono);font-size:24px;font-weight:600;user-select:all}

/* wizard */
.wz-head{display:flex;flex-direction:column;gap:10px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--saffron);border-radius:6px;transition:width .25s ease}
.q{font-size:clamp(21px,5.4vw,26px);line-height:1.25}
.wz-body{display:flex;flex-direction:column;gap:16px}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;min-height:54px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.choice[aria-pressed="true"]{border-color:var(--saffron);box-shadow:inset 0 0 0 1px var(--saffron);background:var(--t-sun)}
.choice .n{font-family:var(--f-mono);font-weight:600;width:20px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--saffron);border-color:transparent;color:var(--on-saffron)}
.scale{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.scale button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-weight:600;font-size:16px;padding:0}
.scale button[aria-pressed="true"]{background:var(--plum);color:var(--bg);border-color:transparent}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);gap:10px}
.timepair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.timepair label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.timepair input{font-family:var(--f-mono);font-size:20px}
.big{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--ink)}
.wz-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:4px}

/* reaction test */
.rt{position:relative;height:230px;border-radius:var(--r);background:var(--surface2);display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.rt .msg{font-family:var(--f-mono);font-size:21px;font-weight:600;color:var(--ink2)}
.rt.stim{background:var(--saffron)}
.rt.stim .msg{color:var(--on-saffron);font-size:44px}
.rt.early{background:var(--low)}
.rt.early .msg{color:var(--bg)}
.timebar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--plum);width:0}

/* recipes */
.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.rcard .nm{font-weight:600;line-height:1.3}
.rcard .en{font-size:12.5px;color:var(--ink2)}
.rcard .tm{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink2);text-align:right}
.rico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.rico svg{width:26px;height:26px}
.k-sun{background:var(--t-sun);color:var(--accent-text)}
.k-good{background:var(--t-good);color:var(--good)}
.k-plum{background:var(--t-plum);color:var(--plum)}
.k-sky{background:var(--t-sky);color:var(--sky)}
.rd-head{display:flex;gap:16px;align-items:center}
.rd-head .rico{width:76px;height:76px;border-radius:24px}
.rd-head .rico svg{width:38px;height:38px}
.rd-head h2{font-size:clamp(22px,5.6vw,27px);line-height:1.2}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:11px 2px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.ing li:first-child button{border-top:0}
.ing .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center}
.ing button[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.ing button[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.ing button[aria-pressed="true"] span:last-child{color:var(--ink2);text-decoration:line-through}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps-list li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps-list li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--plum);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:15px}
.steps-list li span{padding-top:5px}
.combo{font-weight:500}

/* exercise */
.durs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dur{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0}
.dur .n{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--plum)}
.dur .u{font-weight:600;font-size:14px}
.dur .d{font-size:12px;color:var(--ink2);margin-top:4px}
.dur[aria-pressed="true"]{background:var(--saffron);border-color:transparent}
.dur[aria-pressed="true"] .n,.dur[aria-pressed="true"] .u,.dur[aria-pressed="true"] .d{color:var(--on-saffron)}
#mvPlayer{scroll-margin-top:76px}
.player{align-items:stretch;text-align:center}
.player.rest{background:var(--t-sky)}
.player.prep{background:var(--t-plum)}
.fig-wrap{background:var(--t-sun);border-radius:24px;display:grid;place-items:center;padding:10px 6px 4px}
.player.rest .fig-wrap,.player.prep .fig-wrap{background:var(--surface)}
.fig{width:100%;max-width:250px;height:auto;display:block}
.fig-limb{fill:none;stroke:var(--plum);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fig-limb.back{opacity:.45}
.fig-head{fill:var(--plum)}
.fig-ground{stroke:var(--ink2);stroke-opacity:.3;stroke-width:2;stroke-linecap:round}
.fig-wall{fill:var(--ink2);opacity:.25}
.player.rest .fig{opacity:.55}
.ex-name{font-size:22px}
.clock{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1;letter-spacing:-.02em}
.player.rest .clock{color:var(--sky)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.cbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cbtn svg{width:22px;height:22px}
.cbtn.main{width:74px;height:74px;background:var(--saffron);border-color:transparent;color:var(--on-saffron)}
.cbtn.main svg{width:30px;height:30px}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.seq li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px}
.seq li.rest{font-size:13px;color:var(--ink2);padding-block:3px}
.seq li .dotc{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.seq li.now{background:var(--t-sun);font-weight:600}
.seq li.now .dotc{background:var(--saffron);border-color:var(--saffron)}
.seq li.done{color:var(--ink2)}
.seq li.done .dotc{background:var(--good);border-color:var(--good)}
.seq li .mono{font-size:13px;color:var(--ink2)}

/* me */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--ink2)}
.tile .v{font-family:var(--f-mono);font-size:21px;font-weight:600;line-height:1.3}
.tile .s{font-size:12.5px;color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink2)}
.c-good{fill:var(--good)} .c-low{fill:var(--low)} .c-mid{fill:var(--ink2)} .c-sun{fill:var(--saffron)} .c-plum{fill:var(--plum)} .c-sky{fill:var(--sky)}
.c-band{fill:var(--good);opacity:.14} .c-grid{stroke:var(--line);stroke-width:1} .c-empty{fill:var(--surface2)}
.c-line{fill:none;stroke:var(--plum);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-line.sky{stroke:var(--sky)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding-block:12px;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0;padding-top:0}
.cmp .t{grid-column:1/-1;font-weight:600}
.cmp b{font-family:var(--f-mono);font-size:18px;display:block}
.cmp small{font-size:12.5px;color:var(--ink2)}
.example{background:var(--saffron);color:var(--on-saffron);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}

/* team */
.member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding-block:12px;border-top:1px solid var(--line)}
.member:first-child{border-top:0;padding-top:0}
.member .nm{font-weight:600}
.member .bar{grid-column:1/-1;display:flex;gap:4px}
.member .bar span{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.member .bar span.on{background:var(--saffron)}

.toast.show{transform:translate(-50%,0);opacity:1}

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;};

/* ---------- dates & sun ---------- */
const WD=["Ням","Даваа","Мягмар","Лхагва","Пүрэв","Баасан","Бямба"];
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return dkey(new Date());}
function kdate(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(k,n){const d=kdate(k);d.setDate(d.getDate()+n);return dkey(d);}
function wday(k){return kdate(k).getDay();}
function doy(k){const d=kdate(k);return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function nice(k){const d=kdate(k);return (d.getMonth()+1)+"-р сарын "+d.getDate()+", "+WD[d.getDay()]+" гараг";}
function toMin(t){const[h,m]=String(t).split(":").map(Number);return h*60+m;}
function hhmm(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60);}
function dur(bed,wake){let d=toMin(wake)-toMin(bed);if(d<=0)d+=1440;return d;}
function mid(bed,wake){let b=toMin(bed);if(b<18*60)b+=1440;return b-18*60+dur(bed,wake)/2;}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+" ц "+r+" мин":h+" ц"):r+" мин";}
function clockFmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+pad(s%60);}
function sunTimes(date){const lat=47.92,lng=106.92,r=Math.PI/180;const y=date.getFullYear();
  const n=Math.floor((Date.UTC(y,date.getMonth(),date.getDate())-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(n-1);
  const eqt=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return {rise:720-4*(lng+ha)-eqt+480,set:720-4*(lng-ha)-eqt+480};}

/* ---------- store ---------- */
const ST={mode:"loading",localWhy:null,db:null,user:null,uid:null,admin:false,profile:null,days:{},readonly:false,unlocked:false,demo:false,saved:null};

const chains={};
function serial(path,fn){const p=(chains[path]||Promise.resolve()).catch(()=>{}).then(fn);chains[path]=p;return p;}
function loadLocal(){try{const raw=localStorage.getItem(LOCAL_KEY);if(raw){const o=JSON.parse(raw);ST.profile=o.profile||null;ST.days=o.days||{};}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({profile:ST.profile,days:ST.days}));}catch(e){}}
async function initStore(){
  let db=null,user=null;
  try{if(window.claude&&typeof window.claude.use==="function"){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}}catch(e){}
  let uid=null;if(user){try{uid=await user.id();}catch(e){}}
  ST.user=user;
  let ro=false;if(user&&db&&uid){try{ro=(await user.can("data.write"))===false;}catch(e){}}
  if(db&&uid&&!ro){ST.mode="cloud";ST.db=db;ST.uid=uid;try{ST.admin=!!(await user.canEdit());}catch(e){}
    try{const snap=await db.collection("data/users/"+uid).get();snap.docs.forEach(d=>{if(!d.exists)return;const v=clone(d.data());if(d.id==="profile")ST.profile=v;else if(d.id.indexOf("d-")===0)ST.days[d.id.slice(2)]=v;});}
    catch(e){toast("Өгөгдлийг уншиж чадсангүй. Хуудсаа дахин нээнэ үү.");}
  }else{ST.mode="local";ST.localWhy=ro?"readonly":"nocloud";loadLocal();}
  ST.unlocked=!!(ST.profile&&ST.profile.done&&ST.profile.auth&&sessionOk());
}
function localNote(){if(!HOSTED)return "Мэдээлэл тань зөвхөн энэ төхөөрөмжийн хөтөч дээр хадгалагдана. Өөр утас, компьютерээс орвол харагдахгүй.";

function writeErr(e){if(e&&e.code==="invalid_argument"){ST.readonly=true;toast("Хадгалах эрх алга байна. Хуудсыг танд Contributor эрхээр хуваалцсан эсэхийг шалгаарай.");}

  else toast("Хадгалж чадсангүй. Дахин оролдоно уу.");}
async function saveProfile(){if(ST.demo)return;if(ST.mode==="cloud"){try{await serial("profile",()=>ST.db.doc("data/users/"+ST.uid+"/profile").set(clone(ST.profile)));}catch(e){writeErr(e);throw e;}}else saveLocal();}
async function saveDay(k){if(ST.demo)return;if(ST.mode==="cloud"){try{await serial("d-"+k,()=>ST.db.doc("data/users/"+ST.uid+"/d-"+k).set(clone(ST.days[k])));}catch(e){writeErr(e);throw e;}}else saveLocal();}
const PROTEIN=["egg","milk","meat"];
function stats(endKey,n){
  const keys=[];for(let i=n-1;i>=0;i--)keys.push(addDays(endKey,-i));
  const ds=keys.map(k=>ST.days[k]).filter(Boolean);
  const ms=ds.map(d=>d.m).filter(Boolean),es=ds.map(d=>d.e).filter(Boolean);
  const tests=ms.map(m=>m.test).filter(t=>t&&!t.skipped&&!t.practice).map(t=>t.med);
  return {checkins:ds.length,sleepAvg:ms.length?Math.round(avg(ms.map(m=>m.sleepMin))):null,bfDays:ms.filter(m=>m.bf).length,protDays:ms.filter(m=>m.bf&&(m.bfItems||[]).some(i=>PROTEIN.includes(i))).length,
    testMed:tests.length?Math.round(median(tests)):null,focusAvg:es.length?Math.round(avg(es.map(e=>e.focus))*10)/10:null,mornings:ms.length};
}
async function publishShared(){
  if(ST.demo||ST.mode!=="cloud"||!ST.profile||ST.readonly)return;
  const p=ST.profile,t=today();
  try{
    if(p.team){const s=stats(t,7),prev=stats(addDays(t,-7),7);
      const doc={code:p.codename,team:p.team,checkins7:s.checkins,upd:t};
      if(p.share.sleep)doc.sleepAvg=s.sleepAvg;
      if(p.share.food){doc.bfDays=s.bfDays;doc.protDays=s.protDays;doc.mornings=s.mornings;}
      if(p.share.test){doc.testMed=s.testMed;doc.testPrev=prev.testMed;doc.focusAvg=s.focusAvg;}
      await serial("members",()=>ST.db.doc("members/"+ST.uid).set(doc));}
    if(p.research)await serial("research",()=>ST.db.doc("research/"+ST.uid).set({v:1,since:p.researchSince||t,days:researchRows()}));
  }catch(e){writeErr(e);}
}
function researchRows(){const out={};Object.keys(ST.days).sort().forEach(k=>{const d=ST.days[k],m=d.m||{},e=d.e||{};const tst=m.test&&!m.test.skipped&&!m.test.practice?m.test:null;
  out[k]={wd:wday(k),sleep:m.sleepMin??null,mid:m.bed?Math.round(mid(m.bed,m.wake)):null,sleepy:m.sleepy??null,bf:m.bf??null,prot:m.bf?(m.bfItems||[]).some(i=>PROTEIN.includes(i)):null,
    sugar:e.intake?e.intake.some(i=>i==="soda"||i==="energy"):null,fruit:e.intake?e.intake.includes("fruit"):null,screen:e.screenMin??null,focus:e.focus??null,und:e.und??null,test:tst?tst.med:null,lapses:tst?tst.lapses:null,ex:d.x?d.x.min:null};});return out;}

/* ---------- password & session ---------- */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64,iter){iter=iter||150000;const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},key,256);
  return {salt:b64(salt),hash:b64(bits),iter};}
async function checkPw(pw,auth){const h=await hashPw(pw,auth.salt,auth.iter);return h.hash===auth.hash;}
function sessionOk(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");return !!(s&&s.who===(ST.uid||"local")&&s.until>Date.now());}catch(e){return false;}}

 bowl:`<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>`,

const VIEWS=["start","today","morning","evening","food","recipe","move","me","team","privacy","research"];
let current=null,cleanup=null,lastRoute="food",recipeId=null;
function route(){
  if(ST.mode==="loading")return;
  let v=(location.hash||"").slice(1);
  if(v.indexOf("food-")===0){recipeId=v.slice(5);v=R(recipeId)?"recipe":"food";}
  if(!ST.unlocked||!ST.profile||!ST.profile.done)v="start";
  else if(!VIEWS.includes(v)||v==="start")v="today";
  if(v==="research"&&(!ST.admin||ST.demo))v="today";
  if(v==="team"&&!HOSTED)v="today";
  $('[data-tab="team"]').hidden=!HOSTED;
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  if(current&&current!=="recipe"&&v==="recipe")lastRoute=current;
  $$("section[data-view]").forEach(s=>{const on=s.dataset.view===v;s.hidden=!on;if(!on)s.innerHTML="";});
  $("#tabs").hidden=v==="start";$("#setBtn").hidden=v==="start";$("#demoBar").hidden=!ST.demo||v==="start";
  const tabOf={morning:"today",evening:"today",recipe:"food"};
  $$(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===(tabOf[v]||v)?"page":"false"));
  $("#setBtn").setAttribute("aria-current",v==="privacy"||v==="research"?"page":"false");
  const changed=current!==v;current=v;
  ({start:renderStart,today:renderToday,morning:renderMorning,evening:renderEvening,food:renderFood,recipe:renderRecipe,move:renderMove,me:renderMe,team:renderTeam,privacy:renderPrivacy,research:renderResearch})[v]();
  if(changed||v==="recipe"){window.scrollTo(0,0);const s=$(`section[data-view="${v}"]`);s.classList.remove("anim");void s.offsetWidth;s.classList.add("anim");}
}
window.addEventListener("hashchange",route);
function go(h){if(location.hash==="#"+h)route();else location.hash="#"+h;}

/* ---------- reaction test ---------- */
function reactionTest(host,opts){
  host.innerHTML=`<div class="stack"><div class="rt" id="rtArea" role="button" tabindex="0" aria-label="Тестийн талбар"><span class="msg" id="rtMsg">Шар болмогц дарна уу</span></div><div class="timebar"><i id="rtBar"></i></div>
   <div class="row between"><span class="small muted" id="rtInfo" style="flex:1;min-width:180px">Талбар шар болж, тоо гүйж эхэлмэгц аль болох хурдан дарна уу.</span><button class="btn plum" id="rtStart" type="button">Тест эхлүүлэх</button></div></div>`;
  const area=$("#rtArea",host),msg=$("#rtMsg",host),bar=$("#rtBar",host);
  let state="idle",onset=0,timer=null,raf=0,endAt=0,startAt=0,barT=null;const rts=[];let lapses=0,fs=0;
  const setA=(c,t)=>{area.className="rt"+(c?" "+c:"");msg.textContent=t;};
  function schedule(){state="wait";setA("","Хүлээж байна…");timer=setTimeout(show,2000+Math.random()*4000);}
  function show(){state="stim";onset=performance.now();setA("stim","0");tick();timer=setTimeout(()=>{if(state==="stim"){lapses++;rts.push(2000);next("Хоцорчихлоо");}},2000);}
  function tick(){if(state!=="stim")return;msg.textContent=Math.round(performance.now()-onset);raf=requestAnimationFrame(tick);}
  function next(t){cancelAnimationFrame(raf);clearTimeout(timer);state="gap";setA("",t);if(performance.now()>=endAt){finish();return;}timer=setTimeout(schedule,700);}
  function hit(){if(state==="stim"){const rt=performance.now()-onset;rts.push(rt);if(rt>500)lapses++;next(Math.round(rt)+" мс");}
    else if(state==="wait"){fs++;clearTimeout(timer);state="gap";setA("early","Арай эрт дарчихлаа");timer=setTimeout(()=>{if(performance.now()>=endAt)finish();else schedule();},900);}}
  area.addEventListener("pointerdown",e=>{e.preventDefault();hit();});
  area.addEventListener("keydown",e=>{if(e.code==="Space"||e.key===" "||e.key==="Enter"){e.preventDefault();hit();}});
  function finish(){state="done";clearInterval(barT);clearTimeout(timer);cancelAnimationFrame(raf);bar.style.width="100%";
    const res={med:Math.round(median(rts)||0),lapses,fs,n:rts.length,skipped:false};
    setA("",res.n?res.med+" мс":"—");if(opts.onDone)opts.onDone(res);}
  $("#rtStart",host).onclick=()=>{$("#rtStart",host).hidden=true;$("#rtInfo",host).textContent="Хуруугаа талбар дээр бэлэн байлгаарай.";startAt=performance.now();endAt=startAt+60000;area.focus();
    barT=setInterval(()=>{bar.style.width=Math.min(100,(performance.now()-startAt)/600)+"%";},200);schedule();};
  return ()=>{state="done";clearTimeout(timer);clearInterval(barT);cancelAnimationFrame(raf);};
}

  const W=320,H=118,x1=30,x2=W-30,base=90,top=18;
  const P=t=>[x1+(x2-x1)*t,base-(base-top)*Math.sin(Math.PI*t)];
  const path=(a,b)=>{let d="";for(let i=0;i<=40;i++){const[x,y]=P(a+(b-a)*i/40);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}return d;};
  const t=(m-s.rise)/(s.set-s.rise),day=t>=0&&t<=1;
  let g=`<line x1="6" x2="${W-6}" y1="${base}" y2="${base}" class="arc-hz"/><path d="${path(0,1)}" class="arc-path"/>`;
  if(day){const[sx,sy]=P(t);g+=`<path d="${path(0,t)}" class="arc-done"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="17" class="arc-glow"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" class="arc-sun"/>`;}
  else g+=`<path d="M166 24a11 11 0 1 0 9 17 9 9 0 1 1-9-17z" class="arc-moon"/>`;
  g+=`<text x="${x1}" y="${base+19}" text-anchor="middle">${hhmm(s.rise)}</text><text x="${x2}" y="${base+19}" text-anchor="middle">${hhmm(s.set)}</text>`;
  let note;

  else note=`Маргааш нар ${hhmm(sunTimes(new Date(now.getTime()+864e5)).rise)} цагт мандана`;
  return `<svg class="arc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Нар ${hhmm(s.rise)} цагт мандаж, ${hhmm(s.set)} цагт жаргана">${g}</svg>
   <div class="hero-meta"><span>${note}</span><span>Өдрийн урт ${fmtDur(s.set-s.rise)}</span></div>`;
}

/* ---------- wizard core ---------- */
function wzHead(name,i,n){return `<div class="wz-head"><div class="progress"><i style="width:${(i+1)/n*100}%"></i></div><span class="eyebrow">${name} · ${i+1}/${n}</span></div>`;}
function scale9(v){return `<div class="scale">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-v="${n}" aria-pressed="${v===n}" aria-label="${n}, ${KSS[n]}">${n}</button>`).join("")}</div><div class="scale-ends"><span>1 · Маш сэргэг</span><span>9 · Маш нойрмог</span></div>`;}
function choiceList(list,v,attr){return `<div class="choices">${list.map(([val,t])=>`<button class="choice" type="button" data-${attr}="${val}" aria-pressed="${v===val}"><span class="n">${typeof val==="number"?val:""}</span>${t}</button>`).join("")}</div>`;}
function chipList(list,sel,attr){return `<div class="chips">${list.map(([val,t])=>`<button class="chip" type="button" data-${attr}="${val}" aria-pressed="${sel.includes(val)}">${t}</button>`).join("")}</div>`;}
function wzFoot(i,ok,skip,skipLabel){return `<div class="wz-foot"><button class="btn ghost" id="wBack" type="button">${i===0?"Болих":"Буцах"}</button><div class="row">${skip?`<button class="btn ghost" id="wSkip" type="button">${skipLabel||"Алгасах"}</button>`:""}<button class="btn primary" id="wNext" type="button" ${ok?"":"disabled"}>Дараах</button></div></div>`;}

async function saveMorning(){

   <div class="tiles"><div class="tile"><span class="k">Оролцогч</span><span class="v">${people.length}</span></div><div class="tile"><span class="k">Бөглөсөн өдөр</span><span class="v">${rows.length}</span></div>
   <div class="tile"><span class="k">Дундаж нойр</span><span class="v">${sl.length?fmtDur(avg(sl.map(r=>r.sleep))):"—"}</span></div><div class="tile"><span class="k">Амралтын цагийн зөрүү</span><span class="v">${jl.length?avg(jl.map(Math.abs)).toFixed(1)+" ц":"—"}</span><span class="s">${jl.length} хүний дундаж</span></div></div>
   <div class="card"><h3>Нойр ба хариу үйлдэл</h3>${within.length?`<p>7 цагаас бага унтсан өдрүүдэд хариу үйлдэл 8+ цаг унтсан өдрүүдээс дунджаар <b class="mono">${Math.abs(Math.round(w))} мс</b> ${w>=0?"удаан":"хурдан"} байв. Хүн бүрийг өөртэй нь харьцуулсан, ${within.length} хүн.</p>`:`<p class="muted">Хоёр бүлэгт хоёуланд нь өгөгдөлтэй оролцогч хараахан алга.</p>`}</div>
   <div class="card"><div class="row between"><h3>Өгөгдөл</h3><button class="btn soft sm" id="copyCsv" type="button" ${rows.length?"":"disabled"}>CSV хуулах</button></div><p class="small muted">Хуулаад Google Sheets-д буулгана уу.</p><textarea class="input mono" id="csvBox" rows="5" hidden readonly style="min-height:120px;padding:10px;font-size:12px"></textarea></div>`;
  $("#resBack").onclick=()=>go("privacy");
  $("#copyCsv").onclick=()=>{const cols=["pid","date","wd","sleep","mid","sleepy","bf","prot","sugar","fruit","screen","focus","und","test","lapses","ex"];const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>r[c]==null?"":r[c]).join(","))).join("\n");
    const box=$("#csvBox");const fb=()=>{box.hidden=false;box.value=csv;box.focus();box.select();toast("Текстийг сонгосон. Хуулж авна уу.");};
    try{navigator.clipboard.writeText(csv).then(()=>toast("CSV хуулагдлаа"),fb);}catch(e){fb();}};
}

/* ---------- boot ---------- */
try{window.claude?.hot?.snapshot?.(()=>({DM,DE,foodFilter}));}catch(e){}
async function start(data){
  renderThemeBtn();
  if(data){if(data.DM)DM=data.DM;if(data.DE)DE=data.DE;if(data.foodFilter)foodFilter=data.foodFilter;}
  await initStore();
  route();
}
(window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{}));
})();
</script>
</body>
